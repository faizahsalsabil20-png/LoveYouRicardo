<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You, Ricardo 💙</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,Helvetica,sans-serif}
#intro{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#fff;background:radial-gradient(circle,rgba(20,110,220,.18),transparent 45%),#000;transition:opacity 1s,visibility 1s}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none}.heartIcon{font-size:64px;color:#4bb3ff;text-shadow:0 0 10px #168cff,0 0 35px #168cff;animation:beat 1s infinite}
h1{font-size:clamp(32px,7vw,66px);margin:15px 0 8px;text-shadow:0 0 20px #168cff}.sub{color:#b7ddff;font-size:15px}
button{margin-top:30px;padding:14px 28px;border-radius:999px;border:1px solid #58b9ff;background:rgba(20,110,220,.2);color:white;font-size:16px;cursor:pointer;box-shadow:0 0 24px rgba(30,150,255,.45)}
button:hover{background:rgba(30,130,230,.4);transform:scale(1.04)}
#scene{position:fixed;inset:0;opacity:0;transition:opacity 1s}#scene.show{opacity:1}canvas{display:block;width:100%;height:100%}
#center{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);color:#e4f5ff;font-size:clamp(34px,6vw,72px);font-weight:bold;letter-spacing:3px;white-space:nowrap;pointer-events:none;text-shadow:0 0 8px #168cff,0 0 20px #168cff,0 0 50px #168cff;animation:pulse 1.4s infinite ease-in-out}
#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);color:rgba(190,225,255,.75);font-size:12px}
@keyframes beat{50%{transform:scale(1.16)}}@keyframes pulse{50%{opacity:.8;transform:translate(-50%,-50%) scale(1.05)}}
</style>
</head>
<body>
<div id="intro"><div class="heartIcon">♥</div><h1>For you, Ricardo 💙</h1><div class="sub">I made something special for you...</div><button id="open">Open my heart 💙</button></div>
<div id="scene"><canvas id="canvas"></canvas><div id="center">Love You</div><div id="hint">♥ love you, Ricardo ♥</div></div>
<audio id="music" src="love_you.mp3" preload="auto"></audio>
<script>
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d"),intro=document.getElementById("intro"),scene=document.getElementById("scene"),music=document.getElementById("music");
let W,H,DPR,items=[];const words=["love you Ricardo","Love You Ricardo","LOVE YOU Ricardo"];
function resize(){W=innerWidth;H=innerHeight;DPR=Math.min(devicePixelRatio||1,2);canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);makeItems()}
function heart(t){return{x:16*Math.sin(t)**3,y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))}}
function makeItems(){items=[];const scale=Math.min(W,H)/38;
for(let i=0;i<115;i++){const t=i/115*Math.PI*2,h=heart(t);items.push({t,speed:.00016+Math.random()*.00012,offset:(Math.random()-.5)*2.2,size:10+Math.random()*7,alpha:.45+Math.random()*.5,phase:Math.random()*Math.PI*2,scale})}
for(let i=0;i<55;i++){const t=Math.random()*Math.PI*2;items.push({t,speed:.00010+Math.random()*.00014,offset:0,size:9+Math.random()*6,alpha:.25+Math.random()*.4,phase:Math.random()*Math.PI*2,scale,inner:true,inward:.35+Math.random()*.48})}}
function draw(now){ctx.clearRect(0,0,W,H);ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);const scale=Math.min(W,H)/38,cx=W/2,cy=H/2+10;
const g=ctx.createRadialGradient(cx,cy,10,cx,cy,Math.min(W,H)*.35);g.addColorStop(0,"rgba(20,100,210,.12)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.save();ctx.globalCompositeOperation="lighter";ctx.textAlign="center";ctx.textBaseline="middle";
items.forEach((p,i)=>{p.t+=p.speed*16;let h=heart(p.t),x=h.x*scale,y=h.y*scale;if(p.inner){x*=p.inward;y*=p.inward}const f=Math.sin(now*.002+p.phase)*3;x+=Math.cos(p.t)*p.offset*scale*.25+f;y+=Math.sin(p.t)*p.offset*scale*.25+Math.cos(now*.0017+p.phase)*3;const pulse=1+.025*Math.sin(now*.0022);x*=pulse;y*=pulse;const a=p.alpha*(.72+.28*Math.sin(now*.003+p.phase));ctx.font=`700 ${p.size}px Arial`;ctx.fillStyle=`rgba(65,170,255,${a})`;ctx.shadowBlur=10;ctx.shadowColor="rgba(30,140,255,.95)";ctx.fillText(words[i%words.length],cx+x,cy+y)});ctx.restore();
for(let i=0;i<90;i++){const t=i/90*Math.PI*2+now*.00018,h=heart(t),x=cx+h.x*scale*1.01,y=cy+h.y*scale*1.01;ctx.beginPath();ctx.fillStyle="rgba(80,180,255,.55)";ctx.shadowBlur=9;ctx.shadowColor="#168cff";ctx.arc(x,y,1.3,0,Math.PI*2);ctx.fill()}requestAnimationFrame(draw)}
document.getElementById("open").addEventListener("click",async()=>{intro.classList.add("hide");scene.classList.add("show");try{music.currentTime=0;await music.play()}catch(e){}});
addEventListener("resize",resize);resize();requestAnimationFrame(draw);
</script>
</body>
</html>
